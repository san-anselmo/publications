<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Upcoming and past events from San Anselmo Publications — book fairs, launches, signings, and outreach.">
  <title>Events — San Anselmo Publications, Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1.0.15">
</head>
<body>
  <div id="navContainer"></div>
  <div class="page-body">
    <main class="main-content" id="mainContent" role="main">
      <section class="content-section active" aria-label="Events and Appearances">
        <div class="section-inner">
          <header class="page-header">
            <div class="page-eyebrow">In the World</div>
            <h1 class="page-title">Events &amp; <span class="accent">Appearances</span></h1>
            <p class="page-subtitle">Book fairs, launches, and outreach</p>
          </header>
          <div class="events-filter-row" role="group" aria-label="Event filters">
            <span class="events-filter-lbl">When</span>
            <button class="evt-filter-btn active" id="efUpcoming" onclick="setEventFilter('time','upcoming')">Upcoming</button>
            <button class="evt-filter-btn" id="efPast" onclick="setEventFilter('time','past')">Past</button>
            <button class="evt-filter-btn" id="efAll" onclick="setEventFilter('time','all')">All</button>
            <div class="events-divider" aria-hidden="true"></div>
            <span class="events-filter-lbl">Type</span>
            <div class="cs-wrap evt-type-wrap">
              <button class="cs-btn" id="evtTypeBtn" onclick="toggleEvtTypeOpts()" aria-expanded="false">
                <span id="evtTypeLabel">All</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="cs-opts" id="evtTypeOpts" role="listbox"></div>
            </div>
          </div>
          <div class="events-list" id="eventsList" role="list"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="backToTopContainer"></div>
  <script src="data/fallback-data.js?v=1.0.15"></script>
  <script src="js/sheets-cms.js?v=1.0.15"></script>
  <script src="js/components.js?v=1.0.15"></script>
  <script src="js/events.js?v=1.0.15"></script>
</body>
</html>
