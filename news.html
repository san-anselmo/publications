<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Latest news and announcements from San Anselmo Publications, Inc. Follow us on Facebook.">
  <title>News — San Anselmo Publications, Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1.0.15">
</head>
<body>
  <div id="navContainer"></div>
  <div class="page-body">
    <main class="main-content" id="mainContent" role="main">
      <section class="content-section active" aria-label="News and Announcements">
        <div class="section-inner">
          <header class="page-header">
            <div class="page-eyebrow">Latest Updates</div>
            <h1 class="page-title">News &amp; <span class="accent">Announcements</span></h1>
            <p class="page-subtitle">What's happening at San Anselmo</p>
          </header>
          <div class="news-fb-hero">
            <div class="news-fb-hero-card" style="max-width:560px">
              <div class="news-fb-hero-label">
                <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
                Follow us on Facebook
              </div>
              <div class="news-fb-hero-frame">
                <!-- Facebook iframe: uses data-src + IntersectionObserver for zero initial load cost -->
                <iframe
                  id="fbEmbed"
                  data-src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fsananselmopress&tabs=timeline&width=500&height=680&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true"
                  width="500" height="680"
                  style="border:none;overflow:hidden;display:block;width:100%;max-width:100%"
                  scrolling="no" frameborder="0"
                  allowfullscreen="true"
                  allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                  title="San Anselmo Facebook Page"
                  loading="lazy">
                </iframe>
              </div>
              <div class="news-fb-hero-footer">
                <a href="https://www.facebook.com/sananselmopress" target="_blank" rel="noopener" class="news-fb-hero-cta">
                  <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
                  Open Full Page
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="backToTopContainer"></div>
  <script src="data/fallback-data.js?v=1.0.15"></script>
  <script src="js/components.js?v=1.0.15"></script>
  <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', () => {
      injectNav('news');
      injectBackToTop();
      initTheme();
      initBurgerMenu();
      initScrollHandlers();

      /* ── IntersectionObserver for Facebook iframe ──
         The iframe MUST NOT load, fetch data, or execute scripts
         until the user scrolls it into the viewport.
         Protects Core Web Vitals and guarantees instant page load. */
      const fbFrame = document.getElementById('fbEmbed');
      if (fbFrame && fbFrame.dataset.src) {
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                fbFrame.src = fbFrame.dataset.src;
                observer.disconnect();
              }
            });
          }, { rootMargin: '200px' });
          observer.observe(fbFrame);
        } else {
          fbFrame.src = fbFrame.dataset.src;
        }
      }
    });
  </script>
</body>
</html>
