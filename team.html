<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Meet the editors, designers, and advocates behind San Anselmo Publications, Inc.">
  <title>Our Team — San Anselmo Publications, Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1.0.15">
</head>
<body>
  <div id="navContainer"></div>
  <div class="page-body">
    <main class="main-content" id="mainContent" role="main">
      <section class="content-section active" aria-label="Our Team">
        <div class="section-inner">
          <header class="page-header">
            <div class="page-eyebrow">The People</div>
            <h1 class="page-title">Our <span class="accent">Team</span></h1>
            <p class="page-subtitle">The editors, designers, and advocates behind every title</p>
          </header>
          <div class="team-grid" id="teamGrid" role="list"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="backToTopContainer"></div>
  <script src="data/fallback-data.js?v=1.0.15"></script>
  <script src="js/sheets-cms.js?v=1.0.15"></script>
  <script src="js/components.js?v=1.0.15"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      injectNav('team');
      injectBackToTop();
      initTheme();
      initBurgerMenu();
      initScrollHandlers();

      const teamData = await SheetsCMS.getTeam().catch(() => typeof TEAM !== 'undefined' ? TEAM : []);
      const grid = document.getElementById('teamGrid');
      if (grid) {
        grid.innerHTML = teamData.map(t =>
          `<div class="team-card" role="listitem">
            <div class="team-avatar" aria-hidden="true">${t.img ? `<img src="${t.img}" alt="${t.name}" loading="eager" decoding="async" onerror="this.parentElement.textContent='${initials(t.name)}'">` : initials(t.name)}</div>
            <div class="team-name">${t.name}</div>
            <div class="team-role">${t.role}</div>
          </div>`
        ).join('');
      }
    });
  </script>
</body>
</html>
